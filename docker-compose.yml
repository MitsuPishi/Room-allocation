name: unimate

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unimate
      POSTGRES_USER: unimate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimate -d unimate"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: backend
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn server.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips=* --no-access-log"]
    environment: &backend_environment
      UNIMATE_ENVIRONMENT: production
      UNIMATE_DB_HOST: db
      UNIMATE_DB_USER: unimate
      UNIMATE_DB_NAME: unimate
      UNIMATE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      UNIMATE_REDIS_URL: redis://redis:6379/0
      UNIMATE_STORAGE_ROOT: /data
      UNIMATE_ADMIN_USERNAME: ${UNIMATE_ADMIN_USERNAME:-admin}
      UNIMATE_ADMIN_PASSWORD: ${UNIMATE_ADMIN_PASSWORD:?Set UNIMATE_ADMIN_PASSWORD in .env}
      UNIMATE_SECURE_COOKIES: "true"
      UNIMATE_FRONTEND_ORIGIN: ${UNIMATE_PUBLIC_ORIGIN:-https://unimate.local}
      UNIMATE_UPLOAD_LIMIT_MB: ${UNIMATE_UPLOAD_LIMIT_MB:-25}
      UNIMATE_CP_SAT_DEFAULT: ${UNIMATE_CP_SAT_DEFAULT:-false}
    volumes:
      - private_storage:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 10

  worker:
    build:
      context: .
      target: backend
    restart: unless-stopped
    command: ["python", "-m", "server.worker"]
    environment: *backend_environment
    volumes:
      - private_storage:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; from server.config import settings; assert Redis.from_url(settings.redis_url).ping()"]
      interval: 30s
      timeout: 4s
      retries: 5

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      UNIMATE_UPLOAD_LIMIT: "${UNIMATE_UPLOAD_LIMIT_MB:-25}m"
    ports:
      - "${UNIMATE_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: unimate
      PGUSER: unimate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      UNIMATE_BACKUP_PASSPHRASE: ${UNIMATE_BACKUP_PASSPHRASE:?Set UNIMATE_BACKUP_PASSPHRASE in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - private_storage:/data:ro
      - encrypted_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'unimate-*.tar.gz.enc' -mmin -1500 -print -quit | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 2

volumes:
  postgres_data:
  redis_data:
  private_storage:
  encrypted_backups:
