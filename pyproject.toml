[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unimate-room-assignment"
version = "3.0.0"
description = "Validated multi-criteria room assignment for university dormitories"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pandas>=2.2,<3.1",
    "numpy>=2.1,<3",
    "ortools>=9.15,<10",
    "openpyxl>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "redis>=6,<8",
    "rq>=2.4,<3",
    "argon2-cffi>=25,<26",
    "python-multipart>=0.0.20,<1",
    "weasyprint>=69,<70",
    "pillow>=12.3,<13",
    "jinja2>=3.1,<4",
]

[project.scripts]
unimate = "engine.cli:main"

[tool.setuptools]
packages = ["engine", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
